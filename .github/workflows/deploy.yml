# Every push to main runs the project gate and, if it passes, deploys the Worker and the Pages site.
# One-time setup. GitHub > Settings > Secrets and variables > Actions, create:
#   secret   CLOUDFLARE_API_TOKEN - Cloudflare token with Workers Scripts Edit and Pages Edit
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable VITE_ESPN_BASE       - the Worker URL
#   variable PAGES_PROJECT        - the Cloudflare Pages project name
# Then create an environment named production, which the deploy job below targets.
# Worker secrets are never stored in GitHub and are set once, from your own shell:
#   pnpm dlx wrangler secret put ESPN_S2 --name gridiron-gang-espn
# Same command for SWID, PASSPHRASE and ALLOWED_ORIGIN. wrangler deploy does not touch them.
# ALLOWED_ORIGIN must be exactly https://<PAGES_PROJECT>.pages.dev - no trailing slash.
# The Pages deploy below publishes to that production URL, which is the only URL the Worker
# accepts. Per-deploy preview URLs will not work with the Worker.
# The Pages project must already exist before the first deploy:
#   pnpm dlx wrangler pages project create <PAGES_PROJECT> --production-branch=main

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sh tools/adw/gate.sh --full

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check required config
        env:
          VITE_ESPN_BASE: ${{ vars.VITE_ESPN_BASE }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=""
          [ -n "$VITE_ESPN_BASE" ] || missing="$missing vars.VITE_ESPN_BASE"
          [ -n "$PAGES_PROJECT" ] || missing="$missing vars.PAGES_PROJECT"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing vars.CLOUDFLARE_ACCOUNT_ID"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secrets.CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub config:$missing. Set them under Settings > Secrets and variables > Actions (environment: production)."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          VITE_ESPN_BASE: ${{ vars.VITE_ESPN_BASE }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c src/worker/wrangler.jsonc
      - name: Deploy Pages site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.PAGES_PROJECT }} --branch=main
